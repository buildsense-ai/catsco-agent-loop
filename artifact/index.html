<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Saturday 自迭代任务进度">
  <title>自迭代任务台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow">SATURDAY · AGENT LOOP</p>
        <h1>自迭代任务台</h1>
        <p class="lead">审查、开发与验证沿同一条任务链持续推进，直到当前提交被批准。</p>
      </div>
      <div class="head-actions">
        <span class="connection" id="connectionState" data-state="offline"><i></i><b id="healthText">未连接</b></span>
        <button class="quiet-button" id="connectionButton" type="button">管理授权</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="filters" role="group" aria-label="任务筛选">
        <button class="active" type="button" data-filter="all">全部 <b id="runCount">0</b></button>
        <button type="button" data-filter="active">处理中 <b id="activeCount">0</b></button>
        <button type="button" data-filter="done">已结束 <b id="doneCount">0</b></button>
      </div>
      <div class="sync"><time id="lastSync">尚未同步</time><button id="refreshButton" type="button">刷新</button></div>
    </section>

    <section class="tasks" id="runList" aria-live="polite"></section>
  </main>

  <dialog id="connectionDialog">
    <form class="dialog-card" id="connectionForm">
      <header><div><small>管理权限</small><h2>授权任务操作</h2></div><button type="button" data-close aria-label="关闭">×</button></header>
      <label>操作员令牌<input id="operatorToken" type="password" autocomplete="off" required></label>
      <p>查看任务、PR、ZIP 和暂停任务无需令牌。只有恢复、核对和取消会使用该令牌，并且它只保留在当前标签页。</p>
      <button class="primary-button" type="submit">保存管理授权</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
